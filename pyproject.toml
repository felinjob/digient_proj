[project]
name = "digient"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Felipe Teles", email = "felinjob@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "esper>=3.9",
    "pydantic>=2.14.1",
]

[project.scripts]
digient = "digient:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
